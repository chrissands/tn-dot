version: 1

# Newsroom index: drives the /news listing and the homepage news cards.
indices:
  news:
    include:
      - '/news/**'
    exclude:
      - '/news'
    target: /news/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      subtitle:
        select: head > meta[name="subtitle"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="publication-date"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(\/.*)")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

  # Site index: every published page (drives the sitemap). Shared documents
  # (nav, footer, fragments, library) are excluded; robots feeds the sitemap's
  # noindex filtering (set per folder in the bulk metadata sheet).
  site:
    include:
      - '/**'
    exclude:
      - '/nav'
      - '/footer'
      - '/fragments/**'
      - '/library/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(\/.*)")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

  # Search index: page text for the keyword search of the Content AI Search block
  # (used until / unless Content AI is connected). Same pages as the site index.
  search:
    include:
      - '/**'
    exclude:
      - '/nav'
      - '/footer'
      - '/fragments/**'
      - '/library/**'
      - '/config/**'
      - '/content-ai-search'
    target: /search-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      # page text without the section sidebar (side-nav)
      content:
        select: main > div:not(:has(> .side-nav))
        value: words(textContent(el), 0, 300)
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
